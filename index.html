<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Wire — Live AI News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Tokens ─────────────────────────────────────── */
:root {
  --cream:        #faf7f2;
  --cream-dark:   #f2ede4;
  --cream-mid:    #e8e0d0;
  --cream-border: #ddd4c0;
  --terra:        #b85c3a;
  --terra-hover:  #9a4d30;
  --terra-light:  #cd7a5a;
  --terra-dim:    rgba(184,92,58,0.09);
  --terra-dim2:   rgba(184,92,58,0.18);
  --brown:        #2c1a0e;
  --brown-mid:    #5a3e2b;
  --brown-light:  #9a7d68;
  --brown-dim:    #c4aa94;
  --sage:         #4a7c59;
  --sage-dim:     rgba(74,124,89,0.12);
  --rose:         #b84a4a;
  --rose-dim:     rgba(184,74,74,0.1);
  --amber:        #8a6a1a;
  --amber-dim:    rgba(138,106,26,0.1);
  --radius:       14px;
  --radius-sm:    9px;
  --serif:        'Playfair Display', Georgia, serif;
  --sans:         'Inter', -apple-system, sans-serif;
  --max-w:        960px;
}

/* ── Reset ──────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--cream-dark);
  color: var(--brown);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── Page shell ─────────────────────────────────── */
.page {
  max-width: var(--max-w);
  margin: 0 auto;
  background: var(--cream);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Hero ────────────────────────────────────────── */
.hero {
  background: #2c1a0e;
  padding: 1.5rem 1.25rem 1.25rem;
  text-align: center;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.hero-eyebrow { font-size: 9px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #cd7a5a; margin-bottom: 6px; }
.hero-title { font-family: var(--serif); font-size: 1.75rem; font-weight: 400; color: #faf7f2; line-height: 1.2; }
.hero-title em { font-style: italic; color: #cd7a5a; }
.hero-sub { font-size: 12px; color: #c4aa94; margin-top: 6px; }

/* ── Main layout ────────────────────────────────── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 1.25rem;
}

/* Category tabs */
.category-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 1.25rem;
  overflow-x: auto;
  padding-bottom: 8px;
}
.cat-btn {
  padding: 8px 14px;
  background: var(--cream-dark);
  border: 1px solid var(--cream-border);
  border-radius: var(--radius-sm);
  color: var(--brown-mid);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.cat-btn:hover { background: var(--cream-mid); border-color: var(--terra-light); }
.cat-btn.active { background: var(--terra); color: #fff; border-color: var(--terra); }

/* Controls */
.controls {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  margin-bottom: 1.25rem;
  flex-wrap: wrap;
}
.search-input {
  flex: 1;
  min-width: 200px;
  background: var(--cream-dark);
  border: 1px solid var(--cream-border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-family: var(--sans);
  font-size: 14px;
  color: var(--brown);
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--terra); }
.search-input::placeholder { color: var(--brown-dim); }
.refresh-btn {
  background: var(--terra);
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  padding: 10px 18px;
  cursor: pointer;
  transition: background 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.refresh-btn:hover { background: var(--terra-hover); }
.refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.spinner {
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: none;
}
.spinner.visible { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Stories grid */
.stories-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
  flex: 1;
}

/* Story card */
.story-card {
  background: var(--cream-dark);
  border: 1px solid var(--cream-border);
  border-radius: var(--radius);
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: all 0.2s;
}
.story-card:hover {
  border-color: var(--terra-light);
  box-shadow: 0 4px 12px rgba(184,92,58,0.1);
}
.story-badge {
  display: inline-block;
  background: var(--terra-dim);
  color: var(--terra);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 4px 10px;
  border-radius: 6px;
  margin-bottom: 8px;
  width: fit-content;
}
.story-badge.urgent {
  background: var(--rose-dim);
  color: var(--rose);
}
.story-title {
  font-family: var(--serif);
  font-size: 1.1rem;
  font-weight: 500;
  color: var(--brown);
  margin-bottom: 8px;
  line-height: 1.3;
  flex-grow: 1;
}
.story-card:hover .story-title { color: var(--terra); }
.story-summary {
  font-size: 13px;
  color: var(--brown-light);
  margin-bottom: 12px;
  line-height: 1.5;
}
.story-meta {
  font-size: 11px;
  color: var(--brown-dim);
  border-top: 1px solid var(--cream-border);
  padding-top: 10px;
  display: flex;
  justify-content: space-between;
}
.story-link {
  color: var(--terra);
  text-decoration: none;
  font-weight: 600;
}
.story-link:hover { text-decoration: underline; }

/* Empty state */
.empty {
  text-align: center;
  padding: 2rem;
  color: var(--brown-dim);
  font-style: italic;
}

/* Loading */
.loading {
  text-align: center;
  padding: 2rem;
  color: var(--brown-light);
}

/* Error */
.error-box {
  background: var(--rose-dim);
  border: 1px solid rgba(184,74,74,0.2);
  color: var(--rose);
  padding: 1rem;
  border-radius: var(--radius-sm);
  margin-bottom: 1rem;
}
</style>
</head>
<body>
<div class="page">
  <!-- Hero -->
  <div class="hero">
    <div class="hero-eyebrow">📰 Live Feed</div>
    <h1 class="hero-title">AI <em>Wire</em></h1>
    <p class="hero-sub">Latest AI news, research & breakthroughs from across the web</p>
  </div>

  <!-- Main content -->
  <div class="main">
    <!-- Category tabs -->
    <div class="category-tabs" id="catTabs"></div>

    <!-- Controls -->
    <div class="controls">
      <input type="text" class="search-input" id="searchInput" placeholder="Search stories..." oninput="filterStories()">
      <button class="refresh-btn" id="refreshBtn" onclick="fetchStories()">
        <span class="spinner" id="spinner"></span>
        Refresh
      </button>
    </div>

    <!-- Error box -->
    <div id="errorBox" class="error-box" style="display: none;"></div>

    <!-- Stories grid -->
    <div class="stories-grid" id="storiesGrid"></div>
  </div>
</div>

<script>
// ── Configuration ────────────────────────────────
const CATEGORIES = [
  { id: 'all', label: 'All News' },
  { id: 'LLMs', label: 'LLMs' },
  { id: 'Vision', label: 'Vision' },
  { id: 'Agents', label: 'Agents' },
  { id: 'Safety', label: 'Safety' },
  { id: 'Training', label: 'Training' },
  { id: 'Research', label: 'Research' },
  { id: 'Applications', label: 'Applications' }
];

// ── State ────────────────────────────────────────
let allStories = [];
let filteredStories = [];
let selectedCategory = 'all';
let isLoading = false;

// ── API Call ─────────────────────────────────────
async function callClaude(prompt, maxTokens = 1000) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": "your-api-key-here",
      "anthropic-version": "2023-06-01"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: maxTokens,
      messages: [{ role: "user", content: prompt }],
      tools: [{ type: "web_search_20250305", name: "web_search" }]
    })
  });

  if (!response.ok) {
    const error = await response.json();
    throw new Error(error.error?.message || `API Error: ${response.status}`);
  }

  const data = await response.json();
  const textContent = data.content
    .filter(item => item.type === "text")
    .map(item => item.text)
    .join("");

  return textContent;
}

// ── Fetch Stories ────────────────────────────────
async function fetchStories() {
  isLoading = true;
  updateUI();
  document.getElementById('errorBox').style.display = 'none';

  const scope = selectedCategory === 'all'
    ? 'across large language models, computer vision, AI agents, safety, training techniques, research, and real-world applications'
    : `specifically about ${selectedCategory}`;

  const prompt = `Search the web for the top 10 most important and recent AI news stories and research announcements right now ${scope}.

Return ONLY a valid JSON array with NO preamble, NO markdown, NO explanation. Each story must have these exact fields:

{
  "headline": "string",
  "summary": "string (2-3 sentences)",
  "category": "string (one of: LLMs, Vision, Agents, Safety, Training, Research, Applications, Tools, Other)",
  "source": "string (publication name)",
  "url": "string (direct URL)",
  "timestamp": "string (e.g. '2 hours ago' or 'Today')",
  "urgent": boolean
}

Return exactly 10 stories as a JSON array. Start with [ and end with ]. No markdown.`;

  try {
    const raw = await callClaude(prompt, 3000);
    const match = raw.match(/\[[\s\S]*\]/);
    if (!match) throw new Error('Could not parse response as JSON.');

    allStories = JSON.parse(match[0]);
    filterStories();
    showError('');
  } catch (err) {
    showError(err.message);
    allStories = [];
  } finally {
    isLoading = false;
    updateUI();
  }
}

// ── Filter Stories ────────────────────────────────
function filterStories() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  
  filteredStories = allStories.filter(story => {
    const matchesCategory = selectedCategory === 'all' || story.category === selectedCategory;
    const matchesSearch = !search || 
      story.headline.toLowerCase().includes(search) ||
      story.summary.toLowerCase().includes(search) ||
      story.source.toLowerCase().includes(search);
    return matchesCategory && matchesSearch;
  });

  renderStories();
}

// ── Render Stories ───────────────────────────────
function renderStories() {
  const grid = document.getElementById('storiesGrid');

  if (filteredStories.length === 0) {
    grid.innerHTML = '<div class="empty" style="grid-column: 1/-1;">No stories found.</div>';
    return;
  }

  grid.innerHTML = filteredStories.map((story, idx) => `
    <div class="story-card">
      <span class="story-badge ${story.urgent ? 'urgent' : ''}">${story.urgent ? '⚡ Breaking' : story.category}</span>
      <h3 class="story-title">${escapeHtml(story.headline)}</h3>
      <p class="story-summary">${escapeHtml(story.summary)}</p>
      <div class="story-meta">
        <div>${escapeHtml(story.source)} · ${escapeHtml(story.timestamp)}</div>
        <a href="${story.url}" target="_blank" rel="noopener" class="story-link">Read →</a>
      </div>
    </div>
  `).join('');
}

// ── UI Updates ───────────────────────────────────
function updateUI() {
  const btn = document.getElementById('refreshBtn');
  const spinner = document.getElementById('spinner');

  if (isLoading) {
    btn.disabled = true;
    spinner.classList.add('visible');
  } else {
    btn.disabled = false;
    spinner.classList.remove('visible');
  }
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  if (msg) {
    box.textContent = '⚠ ' + msg;
    box.style.display = 'block';
  } else {
    box.style.display = 'none';
  }
}

function escapeHtml(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
  return text.replace(/[&<>"']/g, m => map[m]);
}

// ── Category selection ───────────────────────────
function selectCategory(catId) {
  selectedCategory = catId;
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.cat === catId);
  });
  filterStories();
}

// ── Init ─────────────────────────────────────────
function init() {
  // Render category tabs
  const tabsHtml = CATEGORIES.map(cat => 
    `<button class="cat-btn ${cat.id === 'all' ? 'active' : ''}" data-cat="${cat.id}" onclick="selectCategory('${cat.id}')">${cat.label}</button>`
  ).join('');
  document.getElementById('catTabs').innerHTML = tabsHtml;

  // Fetch initial stories
  fetchStories();
}

// Start
init();
</script>
</body>
</html>
